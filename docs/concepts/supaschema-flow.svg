<text x="62.0" y="321.0" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">Policy bodies are compared structurally, so the tenant-isolation regression every CLI engine misses is caught before it merges.</text>
<text x="40.0" y="362.0" fill="#64748b" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400">supaschema: PostgreSQL's own parser ships in the package, so no step needs a database.</text>
