#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = { granular = { sandbox_approval = true, rules = true, mcp_elicitations = true, request_permissions = false, skill_approval = false } }
approvals_reviewer = 'user'
file_opener = 'vscode'
hide_agent_reasoning = true
mcp_oauth_credentials_store = 'file'
model = 'gpt-5.5'
model_reasoning_effort = 'xhigh'
personality = 'pragmatic'
sandbox_mode = "danger-full-access"
plan_mode_reasoning_effort = 'xhigh'
project_doc_fallback_filenames = ['CLAUDE.md']
service_tier = "default"
show_raw_agent_reasoning = false
suppress_unstable_features_warning = true
web_search = 'live'

[sandbox_workspace_write]
writable_roots = []
network_access = true

[features]
apps = true
collaboration_modes = true
goals = true
hooks = true
js_repl = false
mentions_v2 = true
multi_agent = true
multi_agent_v2 = true
enable_fanout = false
prevent_idle_sleep = true
search_tool = true
shell_snapshot = true
terminal_resize_reflow = true
tui_app_server = true
undo = true

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
bearer_token_env_var = "CLOUDFLARE_API_TOKEN"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.cclsp]
command = "npx"
args = ["cclsp@0.7.0"]

[mcp_servers.cclsp.env]
CCLSP_CONFIG_PATH = ".claude/cclsp.json"

[mcp_servers.supaschema]
command = "uv"
args = [
  "run",
  "--package",
  "supaschema-agent-mcp",
  "fastmcp",
  "run",
  "fastmcp.json",
  "--skip-env",
]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.mintlify]
url = "https://mintlify.com/docs/mcp"

[mcp_servers.next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@latest"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"

[mcp_servers.zod]
url = "https://mcp.inkeep.com/zod/mcp"

[mcp_servers.supaschema-docs]
url = "https://supaschema.com/docs/mcp"
