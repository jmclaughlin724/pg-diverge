#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
bearer_token_env_var = "CLOUDFLARE_API_TOKEN"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.cclsp]
command = "npx"
args = ["cclsp@0.7.0"]

[mcp_servers.cclsp.env]
CCLSP_CONFIG_PATH = ".claude/cclsp.json"

[mcp_servers.supaschema]
command = "uv"
args = [
  "run",
  "--package",
  "supaschema-agent-mcp",
  "fastmcp",
  "run",
  "fastmcp.json",
  "--skip-env",
]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.mintlify]
url = "https://mintlify.com/docs/mcp"

[mcp_servers.next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@latest"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/anilize/anilize"

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"

[mcp_servers.zod]
url = "https://mcp.inkeep.com/zod/mcp"

[mcp_servers.supaschema-docs]
url = "https://supaschema.com/docs/mcp"
