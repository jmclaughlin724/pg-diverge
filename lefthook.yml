# Local git hooks for supaschema (https://lefthook.dev).
#
# Install explicitly with `npx lefthook install`. These hooks enforce the
# existing lint/typecheck/guard suite at the developer boundary so failures
# are caught before CI.
#
# Bypass for an emergency commit with `LEFTHOOK=0 git commit ...` or
# `git commit --no-verify`.

# pre-commit is piped (lefthook: run jobs sequentially, stop when one fails;
# no stdio is chained between jobs) so the sync job observes the formatters'
# output and is skipped when formatting fails. The formatters reflow .claude/**
# sources and re-stage them via stage_fixed; the trailing writer refreshes and
# stages generated mirrors from those final canonical bytes.
#
# The sync job refuses to run while generator input sources carry unstaged
# edits or untracked files: regenerating from the working tree would stage
# mirrors whose canonical sources are not in the commit. It then stages only
# generator-owned output trees; self-sourced inputs (agent-bundle/INSTALL.md,
# skills/README.md, .agents/prompts) are never staged by the hook.

pre-commit:
  piped: true
  jobs:
    - name: Ultracite
      # Format + lint only the staged files; no-op when none match.
      run: npm run format -- --staged
      stage_fixed: true
    - name: prettier
      glob: "*.{md,mdx,yml,yaml}"
      run: npx --no-install prettier --write {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      run: npm run format:toml -- {staged_files}
      stage_fixed: true
    - name: sh
      glob: "*.sh"
      run: npm run format:sh -- {staged_files}
      stage_fixed: true
    - name: sync-agent-surfaces
      run: |
        set -e
        if ! git diff --quiet -- .claude docs scripts/skills .agents/prompts agent-bundle/INSTALL.md skills/README.md CLAUDE.md; then
          echo "sync-agent-surfaces: unstaged edits exist under agent-surface source paths (.claude, docs, scripts/skills, .agents/prompts, agent-bundle/INSTALL.md, skills/README.md, CLAUDE.md)." >&2
          echo "Stage or revert those edits first so regenerated mirrors match the canonical sources in this commit." >&2
          exit 1
        fi
        if [ -n "$(git ls-files --others --exclude-standard -- .claude docs scripts/skills .agents/prompts agent-bundle/INSTALL.md skills/README.md CLAUDE.md)" ]; then
          echo "sync-agent-surfaces: untracked files exist under agent-surface source paths (.claude, docs, scripts/skills, .agents/prompts, agent-bundle/INSTALL.md, skills/README.md, CLAUDE.md)." >&2
          echo "Stage or remove those files first so regenerated mirrors match the canonical sources in this commit." >&2
          exit 1
        fi
        npm run sync:llm
        git add .agents/skills .codex skills/supaschema agent-bundle/agents agent-bundle/claude agent-bundle/codex agent-bundle/docs agent-bundle/skills-manifest.json

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: guard
      run: npm run guard
