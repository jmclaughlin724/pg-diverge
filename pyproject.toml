[project]
name = "supaschema-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest-asyncio==1.4.0",
  "ruff",
  "mypy",
  "python-lsp-server==1.14.0",
  "python-lsp-ruff==2.2.2",
  "python-lsp-black==2.0.0",
  "python-lsp-isort==0.2.1",
  "pylsp-rope==0.1.17",
  "pyls-memestra==0.0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/agent-mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/agent-mcp/tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/agent-mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/agent-mcp/supaschema_agent_mcp"]
