# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: supaschema
description: Run supaschema CLI gates or the config-gated sync pipeline against a declarative SQL tree.
branding:
  color: blue
  icon: git-merge
inputs:
  argv:
    description: JSON array of argv entries passed to supaschema, excluding the binary name (e.g. ["diff","--fail-on-diff","--quiet"] or ["sync","--target","remote"]).
    required: true
  version:
    description: Exact supaschema npm version to run.
    required: false
    default: "0.2.4"
runs:
  using: composite
  steps:
    - name: Run supaschema
      shell: bash
      env:
        SUPASCHEMA_ACTION_VERSION: ${{ inputs.version }}
        SUPASCHEMA_ACTION_ARGV: ${{ inputs.argv }}
        # The action only runs the supaschema CLI as a gate. Suppress the consumer
        # bundle scaffolding so `npx supaschema@...` does not write config, agent
        # files, hook wiring, or .supaschema/install.json into the caller's checkout.
        SUPASCHEMA_SKIP_POSTINSTALL: "1"
      run: node "$GITHUB_ACTION_PATH/scripts/actions/run-supaschema-action.mjs"
