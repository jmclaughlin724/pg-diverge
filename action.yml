name: supaschema
description: Run supaschema gates (drift detection, migration check, verify) against a declarative SQL tree.
branding:
  color: blue
  icon: git-merge
inputs:
  args:
    description: Arguments passed to supaschema (e.g. "diff --from database:$DATABASE_URL --to dir:supabase/schemas --fail-on-diff --quiet").
    required: true
  version:
    description: Exact supaschema npm version to run.
    required: false
    default: "0.1.1"
runs:
  using: composite
  steps:
    - name: Run supaschema
      shell: bash
      env:
        SUPASCHEMA_ACTION_VERSION: ${{ inputs.version }}
        SUPASCHEMA_ACTION_ARGS: ${{ inputs.args }}
      run: |
        if [[ ! "$SUPASCHEMA_ACTION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "invalid supaschema version: $SUPASCHEMA_ACTION_VERSION (use an exact npm version, e.g. 0.1.1)" >&2
          exit 1
        fi
        npx --yes "supaschema@${SUPASCHEMA_ACTION_VERSION}" $SUPASCHEMA_ACTION_ARGS
