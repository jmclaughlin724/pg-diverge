# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: supaschema
description: Run supaschema CLI gates or the config-gated sync pipeline against a declarative SQL tree.
branding:
  color: blue
  icon: git-merge
inputs:
  argv:
    description: JSON array of argv entries passed to supaschema, excluding the binary name. Use ["scan","--reporter","json"] for PR comments and check runs.
    required: true
  version:
    description: Exact supaschema npm version to run. Defaults to this action tag's package.json version.
    required: false
runs:
  using: composite
  steps:
    - name: Run supaschema
      shell: bash
      env:
        SUPASCHEMA_ACTION_VERSION: ${{ inputs.version }}
        SUPASCHEMA_ACTION_ARGV: ${{ inputs.argv }}
        SUPASCHEMA_ACTION_GITHUB_TOKEN: ${{ github.token }}
        SUPASCHEMA_SKIP_POSTINSTALL: "1"
      run: node "$GITHUB_ACTION_PATH/scripts/actions/run-supaschema-action.mjs"
