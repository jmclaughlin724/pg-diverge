name: supaschema
description: Run supaschema gates (drift detection, migration check, verify) against a declarative SQL tree.
branding:
  color: blue
  icon: git-merge
inputs:
  args:
    description: Arguments passed to supaschema (e.g. "diff --from database:$DATABASE_URL --to dir:supabase/schemas --fail-on-diff --quiet").
    required: true
  version:
    description: supaschema version to run (npm dist-tag or exact version).
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Run supaschema
      shell: bash
      env:
        SUPASCHEMA_ACTION_VERSION: ${{ inputs.version }}
        SUPASCHEMA_ACTION_ARGS: ${{ inputs.args }}
      run: |
        case "$SUPASCHEMA_ACTION_VERSION" in
          latest|next|[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*-*) ;;
          *) echo "invalid supaschema version: $SUPASCHEMA_ACTION_VERSION" >&2; exit 1 ;;
        esac
        npx --yes "supaschema@${SUPASCHEMA_ACTION_VERSION}" $SUPASCHEMA_ACTION_ARGS
