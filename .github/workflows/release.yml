name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PG_DIVERGE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5


    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check
      - run: npm run check:package
      - run: npm run benchmark
      - run: npm run fixture:diff
      - name: Verify fixture migration
        run: npm run fixture:verify
      - name: Corpus oracle (dirty-real reconvergence)
        run: npm run corpus:check
      - name: Pack package
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          echo "PG_DIVERGE_TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
      - name: Smoke global tarball install
        run: |
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" "$PG_DIVERGE_TARBALL"
          "$prefix/bin/pg-diverge" --version
          "$prefix/bin/pg-diverge" diff \
            --from dir:tests/fixtures/basic/from \
            --to dir:tests/fixtures/basic/to \
            --out "$RUNNER_TEMP/smoke.sql"
          "$prefix/bin/pg-diverge" check "$RUNNER_TEMP/smoke.sql"
      - name: Smoke npx from tarball
        run: npx --yes --package "$PG_DIVERGE_TARBALL" pg-diverge --version
      - run: npm publish --access public --provenance
      - name: Attest tarball provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.PG_DIVERGE_TARBALL }}
      - name: Attach signed artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          signed_bundle="$RUNNER_TEMP/$(basename "$PG_DIVERGE_TARBALL").sigstore"
          cp "$BUNDLE_PATH" "$signed_bundle"
          gh release upload "$GITHUB_REF_NAME" "$PG_DIVERGE_TARBALL" "$signed_bundle" --repo "$GITHUB_REPOSITORY"
