name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm
  queue: max

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      create-github-release: ${{ steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_CREATE_GITHUB_RELEASE }}
      publish-github-package: ${{ steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE }}
      publish-npm: ${{ steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Release version preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/preflight.mjs

  publish:
    needs: preflight
    if: >-
      needs.preflight.outputs.create-github-release == 'true' || needs.preflight.outputs.publish-github-package == 'true' || needs.preflight.outputs.publish-npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      # The privileged publish job enforces the endpoint baseline observed in
      # the successful 0.4.0 trusted-publishing run.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443 api.github.com:443 fulcio.sigstore.dev:443 github.com:443 npm.pkg.github.com:443 registry.npmjs.org:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # No check-latest: use the runner's cached Node 24 toolcache (deterministic
      # patch, no nodejs.org fetch on the OIDC publish job). The npm-version
      # preflight below fails loudly if the cached npm predates 11.5.1.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Release version preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/preflight.mjs
      - name: Confirm npm supports OIDC trusted publishing
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: |
          npm --version
          node -e "const { execFileSync } = require('node:child_process'); const raw = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); const match = /^(\d+)\.(\d+)\.(\d+)/.exec(raw); if (!match) throw new Error('could not parse npm version: ' + raw); const [major, minor, patch] = match.slice(1).map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm >= 11.5.1 is required for trusted publishing, found ' + raw);"
      - if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: npm ci
      - if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: npm audit signatures
      - if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: npm run build
      - if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: npm run check:package
      - name: Pack package
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)"
          tarball_path="$RUNNER_TEMP/$tarball"
          echo "SUPASCHEMA_TARBALL=$tarball_path" >> "$GITHUB_ENV"
          echo "tarball_path=$tarball_path" >> "$GITHUB_OUTPUT"
      # Render into an isolated subdir, matching ci.yml: supaschema treats the
      # --out parent directory as the migrations dir for the lineage chain gate,
      # so the smoke render must not share $RUNNER_TEMP with the packed tarball,
      # the sigstore bundle, or any future second render.
      - name: Smoke npx from tarball
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true' || steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        run: |
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema --version
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema \
            --config tests/fixtures/basic/supaschema.config.json \
            diff \
            --from dir:tests/fixtures/basic/from \
            --to dir:tests/fixtures/basic/to \
            --out "$RUNNER_TEMP/smoke/basic.sql"
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema check "$RUNNER_TEMP/smoke/basic.sql"
      - name: Prepare GitHub Packages tarball
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        id: github-pack
        run: |
          github_tarball="$(node scripts/release/github-package-tarball.mjs --tarball "$SUPASCHEMA_TARBALL" --pack-destination "$RUNNER_TEMP")"
          echo "SUPASCHEMA_GITHUB_PACKAGE_TARBALL=$github_tarball" >> "$GITHUB_ENV"
          echo "tarball_path=$github_tarball" >> "$GITHUB_OUTPUT"
      - if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true'
        run: npm publish "$SUPASCHEMA_TARBALL" --access public --provenance
      - name: Attest tarball provenance
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_NPM == 'true'
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.pack.outputs.tarball_path }}
      # GitHub Release creation is part of the publish transaction.
      - name: Prepare GitHub release notes
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_CREATE_GITHUB_RELEASE == 'true'
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          node scripts/release/changelog-notes.mjs --version "$SUPASCHEMA_PACKAGE_VERSION" --out "$notes_file"
          echo "SUPASCHEMA_RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
      - name: Create GitHub release
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_CREATE_GITHUB_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$SUPASCHEMA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$SUPASCHEMA_RELEASE_TAG" \
            --notes-file "$SUPASCHEMA_RELEASE_NOTES_FILE"
      - name: Publish GitHub Packages mirror
        if: steps.preflight.outputs.SUPASCHEMA_RELEASE_SHOULD_PUBLISH_GITHUB_PACKAGE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npmrc="$RUNNER_TEMP/github-packages.npmrc"
          umask 077
          printf '@jmclaughlin724:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$SUPASCHEMA_GITHUB_PACKAGE_TARBALL" --registry https://npm.pkg.github.com
