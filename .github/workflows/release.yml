name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SUPASCHEMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5


    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Confirm npm supports OIDC trusted publishing
        run: |
          npm --version
          node -e "const { execFileSync } = require('node:child_process'); const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); const [major, minor, patch] = version.split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm >= 11.5.1 is required for trusted publishing');"
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check
      - run: npm run check:package
      - run: npm run benchmark
      - run: npm run fixture:diff
      - name: Verify fixture migration
        run: npm run fixture:verify
      - name: Corpus oracle (dirty-real reconvergence)
        run: npm run corpus:check
      - name: Pack package
        id: pack
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          tarball_path="$RUNNER_TEMP/$tarball"
          echo "SUPASCHEMA_TARBALL=$tarball_path" >> "$GITHUB_ENV"
          echo "tarball_path=$tarball_path" >> "$GITHUB_OUTPUT"
      - name: Smoke npx from tarball
        run: |
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema --version
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema diff \
            --from dir:tests/fixtures/basic/from \
            --to dir:tests/fixtures/basic/to \
            --out "$RUNNER_TEMP/smoke.sql"
          npx --yes --package "$SUPASCHEMA_TARBALL" supaschema check "$RUNNER_TEMP/smoke.sql"
      - run: npm publish --access public --provenance
      - name: Attest tarball provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball_path }}
      - name: Attach signed artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          signed_bundle="$RUNNER_TEMP/$(basename "$SUPASCHEMA_TARBALL").sigstore"
          cp "$BUNDLE_PATH" "$signed_bundle"
          gh release upload "$GITHUB_REF_NAME" "$SUPASCHEMA_TARBALL" "$signed_bundle" --repo "$GITHUB_REPOSITORY"
