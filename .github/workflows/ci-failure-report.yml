name: CI Failure Report

on:
  workflow_run:
    workflows: [CI, Docs, CodeQL, Dependency Review]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request'


    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Sync CI failure marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github/report-ci-failure.mjs
