name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-review:
    # Block PRs that introduce known-vulnerable or license-incompatible deps
    # before merge. supaschema ships dual-licensed: AGPL-3.0-only (LICENSE) for
    # open-source use, or a commercial license (LICENSE-COMMERCIAL.md) for
    # proprietary/hosted use. Fail closed when a changed dependency introduces
    # a license outside the reviewed SPDX allow-list below.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # An allow-list fails closed when a dependency introduces an
          # unreviewed license. Keep exceptions package-specific.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, ISC, MIT, MPL-2.0, Python-2.0
          allow-dependencies-licenses: pkg:npm/spawndamnit
