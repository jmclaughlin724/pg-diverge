[project]
name = "supaschema-agent-mcp"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastmcp==3.4.0", "pydantic==2.11.7", "pytest-asyncio==1.4.0"]

[project.scripts]
supaschema-agent-mcp = "supaschema_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
